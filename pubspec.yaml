name: shortvideo
description: "A new Flutter project."
publish_to: 'none'

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  lpinyin: ^2.0.3
  path_provider: ^2.1.5
  get_native_error: ^0.0.1

  # 播放器底层
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1       # 建议同步升级到最新
  media_kit_libs_android_video: ^1.3.6
  
  # 升级文件选择器到最新版（解决 API 36 冲突的关键）
  file_picker: ^13.1.0
  
  # 顺便升级这两个插件，消除开头的 KGP 警告
  package_info_plus: ^10.2.2
  wakelock_plus: ^1.8.1
  

# dependencies:
#   flutter:
#     sdk: flutter
#   cupertino_icons: ^1.0.8
#   http: ^1.2.2
#   lpinyin: ^2.0.3
#   path_provider: ^2.1.5
  
  # 退回最稳定的官方播放器（底层调用系统 ExoPlayer）
  # video_player: ^2.9.2
  
  # # 保留最新的文件选择器（用于选择本地目录）
  # file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # 这行必须要有，否则所有图标显示为问号
  uses-material-design: true
  
  # 注册中文字体
  fonts:
    - family: MyFont
      fonts:
        - asset: assets/fonts/my_font.ttf